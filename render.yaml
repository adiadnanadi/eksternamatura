# Render Blueprint — BESPLATAN plan (Free) + Neon Postgres baza
#
# Rezultat: https://maturatk.onrender.com (HTTPS, auto-deploy pri svakom pushu)
#
# Baza: vanjski Neon Postgres (free) — login/registracija i statistika
# preživljavaju gašenje servisa. tokene/veze se NE čuvaju u git-u:
#   - DATABASE_URL  → Neon connection string (Render → Env → DATABASE_URL)
#   - ADMIN_EMAILS  → zarezom odvojeni email-ovi za /admin stranicu
services:
  - type: web
    name: kviz-maturasve
    runtime: node
    plan: free
    region: frankfurt        # najbliži region Bosni i Hercegovini
    buildCommand: npx prisma generate && npm run db:push && npm run seed && npm run build
    startCommand: export HOSTNAME=0.0.0.0 && npm run start
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon Postgres connection string — postavi ručno u dashboardu
      - key: ADMIN_EMAILS
        sync: false          # npr. "moj@email.com,admin@email.com" — ko vidi /admin
      - key: AUTH_SECRET
        generateValue: true  # Render sam generiše dugi nasumični tajni ključ
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=448   # Free instanca ima samo 512 MB RAM-a
